<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 문장</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: sans-serif;
    background: #121212;
    color: #f5f5f5;
}
.screen {
    min-height: 100vh;
    text-align: center;
}
.hidden { display: none !important; }

#mainScreen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}
#mainScreen h1 {
    font-size: 36px;
    margin-bottom: 35px;
}

#selectScreen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#sentenceArea {
width: 100%;
display: flex;
flex-direction: column;
align-items: center;
}

#sentenceTextArea {
width: 100%;
display: flex;
flex-direction: column;
align-items: center;
}

#sentence {
width: 90%;
min-height: 50px;
display: flex;
justify-content: center;
align-items: center;
font-size: 40px;
line-height: 1.4;
word-break: keep-all;
}

.buttons {
    margin-top: 80px;
}
button {
    min-width: 80px;
    padding: 10px 18px;
    margin: 5px;
    font-size: 16px;
    background: #000000;
    color: #ffffff;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #f5f5f5;
}
.bottom-buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 5px;
}

#reading {
    min-height: 30px;
    margin-bottom:0px;
    font-size: 20px;
    color: #f5f5f5;
}

#originalScreen {
    min-height: 100vh;
    padding: 40px 20px;
    overflow-y: auto;
}

#originalText {
    width: 90%;
    max-width: 700px;
    margin: 0 auto;
    text-align: left;
    white-space: pre-wrap;
    font-size: 24px;
    line-height: 1.8;
}

#sentenceGroupScreen,
#originalGroupScreen {
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;
}

#sentenceGroupScreen .bottom-buttons,
#originalGroupScreen .bottom-buttons {
    position: absolute;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);
}

.group-buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

#sentenceScreen {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

</style>
</head>

<body>

<div id="mainScreen" class="screen">
    <h1>일본어 문장</h1>
    <button onclick="openSelectScreen()">
        학습
    </button>

</div>

<div id="selectScreen" class="screen hidden">

    <h1>선택</h1>
    <div class="select-buttons">
        <button onclick="openSentenceGroups()">
            문장
        </button>
        <button onclick="openOriginalGroups()">
            원문
        </button>
    </div>

    <div class="bottom-buttons">
        <button onclick="goHome()"></button>
        <button onclick="goBack()">←</button>
    </div>

</div>

<div id="sentenceGroupScreen" class="screen hidden">

    <div class="group-content">

        <h1>문장</h1>

        <div class="group-buttons">
            <button onclick="openSentence(1)">小一</button>
            <button onclick="openSentence(2)">小二</button>
            <button onclick="openSentence(3)">小三</button>
            <button onclick="openSentence(4)">小四</button>
            <button onclick="openSentence(5)">小五</button>
            <button onclick="openSentence(6)">中一</button>
            <button onclick="openSentence(7)">中二</button>
            <button onclick="openSentence(8)">中三</button>
            <button onclick="openSentence(9)">中四</button>
            <button onclick="openSentence(10)">中五</button>
        </div>

    </div>

    <div class="bottom-buttons">
        <button onclick="goHome()"></button>
        <button onclick="goBack()">←</button>
    </div>

</div>

<div id="originalGroupScreen" class="screen hidden">

    <div class="group-content">

        <h1>원문</h1>

        <div class="group-buttons">
            <button onclick="openOriginal(1)">小1</button>
            <button onclick="openOriginal(2)">小2</button>
            <button onclick="openOriginal(3)">小3</button>
            <button onclick="openOriginal(4)">小4</button>
            <button onclick="openOriginal(5)">小5</button>
            <button onclick="openOriginal(6)">中1</button>
            <button onclick="openOriginal(7)">中2</button>
            <button onclick="openOriginal(8)">中3</button>
            <button onclick="openOriginal(9)">中4</button>
            <button onclick="openOriginal(10)">中5</button>
        </div>

    </div>

    <div class="bottom-buttons">
        <button onclick="goHome()"></button>
        <button onclick="goBack()">←</button>
    </div>

    </div>
</div>


<div id="originalScreen" class="screen hidden">
    <div id="originalText">
    </div>

    <div class="bottom-buttons">
        <button onclick="goHome()"></button>
        <button onclick="goBack()">←</button>
    </div>

</div>

<div id="sentenceScreen" class="screen hidden">
    <div id="sentenceArea">
        <div id="sentenceTextArea">
            <div id="reading"></div>
            <div id="sentence">

        </div>

        <div class="buttons">

            </button>
            <button onclick="nextSentence()">

            <button onclick="goBack()">

        </div>
    </div>
</div>

let currentIndex = 0;
let currentSentences = sentences小一;
let autoTimer = null;
let isPlaying = false;
let showReading = false;

const AUTO_INTERVAL = 3000;

function openSentence(section) {

    if (section === 1) {
        currentSentences = sentences小一;
    } else if (section === 2) {
        currentSentences = sentences小二;
    } else if (section === 3) {
        currentSentences = sentences小三;
    } else if (section === 4) {
        currentSentences = sentences小四;
    } else if (section === 5) {
        currentSentences = sentences小五;
    } else if (section === 6) {
        currentSentences = sentences中一;
    } else if (section === 7) {
        currentSentences = sentences中二;
    } else if (section === 8) {
        currentSentences = sentences中三;
    } else if (section === 9) {
        currentSentences = sentences中四;
    } else if (section === 10) {
        currentSentences = sentences中五;
    }

    currentIndex = 0;

    document.getElementById("sentenceGroupScreen").classList.add("hidden");
    document.getElementById("sentenceScreen").classList.remove("hidden");

    showSentence();
}

function goHome() {

    clearInterval(autoTimer);
    autoTimer = null;
    isPlaying = false;

    document.getElementById("startButton").textContent = "▶︎";

    document.getElementById("selectScreen").classList.add("hidden");
    document.getElementById("sentenceGroupScreen").classList.add("hidden");
    document.getElementById("originalGroupScreen").classList.add("hidden");
    document.getElementById("sentenceScreen").classList.add("hidden");
    document.getElementById("originalScreen").classList.add("hidden");

    document.getElementById("mainScreen").classList.remove("hidden");

}

function showSentence() {
    const item = currentSentences[currentIndex];

    document.getElementById("sentence").textContent = item.sentence;
    document.getElementById("reading").textContent = showReading ? item.reading : "";

}

function prevSentence() {
    currentIndex--;

    if (currentIndex < 0) {
        currentIndex = currentSentences.length - 1;
    }

    showSentence();
}

function nextSentence() {
    if (currentIndex < currentSentences.length - 1) {
        currentIndex++;
        showSentence();
    } else {

        clearInterval(autoTimer);
        isPlaying = false;
        document.getElementById("startButton").textContent = "▶︎";
    }
}

function resetSentence() {
    clearInterval(autoTimer);
    isPlaying = false;
    currentIndex = 0;
    showSentence();
    document.getElementById("startButton").textContent = "▶︎";
}

function toggleAutoPlay() {
    if (isPlaying) {
        clearInterval(autoTimer);
        autoTimer = null;
        isPlaying = false;
        document.getElementById("startButton").textContent = "▶︎";
    } else {
        isPlaying = true;
        document.getElementById("startButton").textContent = "❚❚";

        autoTimer = setInterval(function() {
            nextSentence();
        }, AUTO_INTERVAL);
    }
}

function toggleReading() {
    showReading = !showReading;

    const item = currentSentences[currentIndex];
    document.getElementById("reading").textContent = showReading ? item.reading : "";
    document.getElementById("readingButton").textContent = showReading ? "★" : "☆";
}

function openSelectScreen() {

    document.getElementById("mainScreen").classList.add("hidden");
    document.getElementById("selectScreen").classList.remove("hidden");

}

function openSentenceGroups() {

    document
        .getElementById("selectScreen")
        .classList.add("hidden");

    document
        .getElementById("sentenceGroupScreen")
        .classList.remove("hidden");

}


function openOriginalGroups() {

    document
        .getElementById("selectScreen")
        .classList.add("hidden");

    document
        .getElementById("originalGroupScreen")
        .classList.remove("hidden");

}

function goBack() {

    if (!document.getElementById("sentenceScreen").classList.contains("hidden")) {

        document.getElementById("sentenceScreen").classList.add("hidden");
        document.getElementById("sentenceGroupScreen").classList.remove("hidden");

        clearInterval(autoTimer);
        autoTimer = null;
        isPlaying = false;

        document.getElementById("startButton").textContent = "▶︎";

        return;
    }


    if (!document.getElementById("originalScreen").classList.contains("hidden")) {

        document.getElementById("originalScreen").classList.add("hidden");
        document.getElementById("originalGroupScreen").classList.remove("hidden");

        return;
    }


    if (!document.getElementById("sentenceGroupScreen").classList.contains("hidden")) {

        document.getElementById("sentenceGroupScreen").classList.add("hidden");
        document.getElementById("selectScreen").classList.remove("hidden");

        return;
    }


    if (!document.getElementById("originalGroupScreen").classList.contains("hidden")) {

        document.getElementById("originalGroupScreen").classList.add("hidden");
        document.getElementById("selectScreen").classList.remove("hidden");

        return;
    }


    if (!document.getElementById("selectScreen").classList.contains("hidden")) {

        document.getElementById("selectScreen").classList.add("hidden");
        document.getElementById("mainScreen").classList.remove("hidden");

        return;
    }

}


function openOriginal(section) {

    let currentOriginals;

    if (section === 1) {
        currentOriginals = originals小一;
    } else if (section === 2) {
        currentOriginals = originals小二;
    } else if (section === 3) {
        currentOriginals = originals小三;
    } else if (section === 4) {
        currentOriginals = originals小四;
    } else if (section === 5) {
        currentOriginals = originals小五;
    } else if (section === 6) {
        currentOriginals = originals中一;
    } else if (section === 7) {
        currentOriginals = originals中二;
    } else if (section === 8) {
        currentOriginals = originals中三;
    } else if (section === 9) {
        currentOriginals = originals中四;
    } else if (section === 10) {
        currentOriginals = originals中五;
    }

    document
        .getElementById("originalGroupScreen")
        .classList.add("hidden");

    document
        .getElementById("originalScreen")
        .classList.remove("hidden");

    document
        .getElementById("originalText")
        .textContent = currentOriginals[0].text;

    document
        .getElementById("originalScreen")
        .scrollTop = 0;
}

</script>
